<svg width="100%" viewBox="0 0 680 1100" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif; background: #1a1a1a;">
<style>
  .th { font-size: 14px; font-weight: 500; fill: #e0ddd4; }
  .ts { font-size: 12px; font-weight: 400; fill: #e0ddd4; }
  .fill-amber { fill: #633806; stroke: #FAC775; }
  .fill-coral { fill: #712B13; stroke: #F0997B; }
  .fill-purple { fill: #3C3489; stroke: #AFA9EC; }
  .fill-teal { fill: #085041; stroke: #5DCAA5; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- BATTERY -->
<rect class="fill-amber" x="40" y="30" width="110" height="80" rx="4" stroke-width="0.5"/>
<text class="th" x="95" y="52" text-anchor="middle" dominant-baseline="central">12V battery</text>
<line x1="150" y1="50" x2="175" y2="50" stroke="#e0ddd4" stroke-width="1"/>
<text class="ts" x="158" y="44">+</text>
<line x1="150" y1="90" x2="175" y2="90" stroke="#e0ddd4" stroke-width="1"/>
<text class="ts" x="158" y="84">-</text>

<path d="M175 50 L260 50" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<path d="M175 90 L200 90 L200 75 L260 75" fill="none" stroke="#e0ddd4" stroke-width="1.5"/>
<circle cx="270" cy="62" r="14" fill="none" stroke="#e0ddd4" stroke-width="1"/>
<circle cx="270" cy="62" r="3" fill="#e0ddd4"/>
<text class="ts" x="225" y="36">DC jack cable</text>

<!-- BFF -->
<rect class="fill-coral" x="210" y="115" width="270" height="170" rx="4" stroke-width="0.5"/>
<text class="th" x="345" y="137" text-anchor="middle" dominant-baseline="central">Adafruit DC Power BFF</text>
<rect x="230" y="155" width="76" height="24" rx="3" fill="none" stroke="#9a9890" stroke-width="0.5" stroke-dasharray="3 2"/>
<text class="ts" x="268" y="171" text-anchor="middle" dominant-baseline="central">DC jack</text>
<rect x="340" y="155" width="90" height="24" rx="3" fill="none" stroke="#9a9890" stroke-width="0.5" stroke-dasharray="3 2"/>
<text class="ts" x="385" y="171" text-anchor="middle" dominant-baseline="central">MPM3610</text>
<line x1="306" y1="167" x2="340" y2="167" stroke="#9a9890" stroke-width="0.5" stroke-dasharray="2 2"/>
<text class="ts" x="385" y="193" text-anchor="middle" fill="#F0997B">5V out</text>
<rect x="230" y="205" width="100" height="24" rx="3" fill="none" stroke="#9a9890" stroke-width="0.5" stroke-dasharray="3 2"/>
<text class="ts" x="280" y="221" text-anchor="middle" dominant-baseline="central">Terminal block</text>
<line x1="268" y1="179" x2="268" y2="205" stroke="#9a9890" stroke-width="0.5" stroke-dasharray="2 2"/>
<text class="ts" x="280" y="245" text-anchor="middle" opacity="0.35">12V pass-through</text>
<path d="M270 76 L270 115" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<line x1="210" y1="213" x2="190" y2="213" stroke="#e0ddd4" stroke-width="1"/>
<text class="ts" x="202" y="207" opacity="0.5">+</text>
<line x1="210" y1="231" x2="190" y2="231" stroke="#e0ddd4" stroke-width="1"/>
<text class="ts" x="202" y="225" opacity="0.5">-</text>
<path d="M385 179 L385 260 L290 260 L290 290" fill="none" stroke="#9a9890" stroke-width="0.5" stroke-dasharray="2 2"/>
<path d="M350 260 L350 290" fill="none" stroke="#9a9890" stroke-width="0.5" stroke-dasharray="2 2"/>
<text class="ts" x="278" y="278" text-anchor="end" opacity="0.4">5V</text>
<text class="ts" x="338" y="278" text-anchor="end" opacity="0.4">GND</text>

<!-- XIAO -->
<rect class="fill-purple" x="200" y="290" width="280" height="210" rx="4" stroke-width="0.5"/>
<text class="th" x="340" y="314" text-anchor="middle" dominant-baseline="central">XIAO ESP32-C6</text>

<text class="ts" x="218" y="350" opacity="0.35">D0 (GPIO0)</text>
<text class="ts" x="218" y="368" opacity="0.35">D1 (GPIO1)</text>
<text class="ts" x="218" y="386" opacity="0.35">D2 (GPIO2)</text>
<text class="ts" x="218" y="404" opacity="0.35">D3 (GPIO21)</text>
<text class="ts" x="218" y="426">D4 (GPIO22) — SDA</text>
<text class="ts" x="218" y="448">D5 (GPIO23) — SCL</text>
<text class="ts" x="218" y="470" opacity="0.35">D6 (GPIO16)</text>

<text class="ts" x="462" y="350" text-anchor="end">5V (from BFF)</text>
<text class="ts" x="462" y="368" text-anchor="end">GND (from BFF)</text>
<text class="ts" x="462" y="392" text-anchor="end">3V3</text>
<text class="ts" x="462" y="416" text-anchor="end" opacity="0.35">D10 (GPIO20)</text>
<text class="ts" x="462" y="434" text-anchor="end" opacity="0.35">D9 (GPIO19)</text>
<text class="ts" x="462" y="452" text-anchor="end" opacity="0.35">D8 (GPIO18)</text>
<text class="ts" x="462" y="470" text-anchor="end" opacity="0.35">D7 (GPIO23)</text>

<text class="ts" x="218" y="490" opacity="0.35">LED (GPIO15) on-board</text>

<line x1="480" y1="392" x2="500" y2="392" stroke="#e0ddd4" stroke-width="1"/>
<line x1="200" y1="426" x2="180" y2="426" stroke="#e0ddd4" stroke-width="1"/>
<line x1="200" y1="448" x2="180" y2="448" stroke="#e0ddd4" stroke-width="1"/>

<!-- JUMPER -->
<path d="M190 213 L40 213 L40 540 L160 540" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<text class="ts" x="46" y="390" fill="#D85A30">12V</text>
<text class="ts" x="160" y="528" text-anchor="middle">Vin+</text>
<text class="ts" x="340" y="528" text-anchor="middle">Vin-</text>
<path d="M160 540 L340 540" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="160" cy="540" r="3" fill="#D85A30"/>
<circle cx="340" cy="540" r="3" fill="#D85A30"/>
<text class="ts" x="250" y="560" text-anchor="middle" fill="#D85A30">Jumper wire (voltage-only mode)</text>
<line x1="160" y1="543" x2="160" y2="600" stroke="#D85A30" stroke-width="1"/>
<line x1="340" y1="543" x2="340" y2="600" stroke="#D85A30" stroke-width="1"/>

<!-- INA260 -->
<rect class="fill-teal" x="60" y="600" width="460" height="380" rx="4" stroke-width="0.5"/>
<text class="th" x="290" y="630" text-anchor="middle" dominant-baseline="central">Adafruit INA260 breakout</text>
<text class="ts" x="290" y="654" text-anchor="middle" dominant-baseline="central">I2C address 0x40 (A0, A1 open)</text>

<rect x="100" y="684" width="300" height="40" rx="3" fill="none" stroke="#9a9890" stroke-width="0.5" stroke-dasharray="3 2"/>
<text class="ts" x="250" y="708" text-anchor="middle" dominant-baseline="central">Screw terminal block (Vin+, Vin-)</text>
<text class="ts" x="250" y="748" text-anchor="middle" opacity="0.35">2m internal shunt</text>

<rect x="100" y="770" width="200" height="30" rx="3" fill="none" stroke="#9a9890" stroke-width="0.5" stroke-dasharray="3 2"/>
<text class="ts" x="200" y="789" text-anchor="middle" dominant-baseline="central">VB jumper (default: closed)</text>
<text class="ts" x="200" y="820" text-anchor="middle" opacity="0.35">VBus = Vin+ on-board</text>

<text class="ts" x="290" y="856" text-anchor="middle" opacity="0.4">Bottom header pins</text>

<circle cx="92" cy="888" r="3" fill="#e0ddd4" opacity="0.5"/>
<line x1="92" y1="891" x2="92" y2="914" stroke="#e0ddd4" stroke-width="1"/>
<text class="ts" x="92" y="930" text-anchor="middle">GND</text>

<circle cx="150" cy="888" r="3" fill="#e0ddd4" opacity="0.5"/>
<line x1="150" y1="891" x2="150" y2="914" stroke="#e0ddd4" stroke-width="1"/>
<text class="ts" x="150" y="930" text-anchor="middle">Vcc</text>

<circle cx="208" cy="888" r="3" fill="#e0ddd4" opacity="0.5"/>
<line x1="208" y1="891" x2="208" y2="914" stroke="#e0ddd4" stroke-width="1"/>
<text class="ts" x="208" y="930" text-anchor="middle">SCL</text>

<circle cx="266" cy="888" r="3" fill="#e0ddd4" opacity="0.5"/>
<line x1="266" y1="891" x2="266" y2="914" stroke="#e0ddd4" stroke-width="1"/>
<text class="ts" x="266" y="930" text-anchor="middle">SDA</text>

<circle cx="324" cy="888" r="3" fill="#e0ddd4" opacity="0.2"/>
<line x1="324" y1="891" x2="324" y2="914" stroke="#e0ddd4" stroke-width="1" opacity="0.3"/>
<text class="ts" x="324" y="930" text-anchor="middle" opacity="0.3">Alert NC</text>

<circle cx="382" cy="888" r="3" fill="#e0ddd4" opacity="0.2"/>
<line x1="382" y1="891" x2="382" y2="914" stroke="#e0ddd4" stroke-width="1" opacity="0.3"/>
<text class="ts" x="382" y="930" text-anchor="middle" opacity="0.3">VBus</text>

<circle cx="438" cy="888" r="3" fill="#e0ddd4" opacity="0.2"/>
<line x1="438" y1="891" x2="438" y2="914" stroke="#e0ddd4" stroke-width="1" opacity="0.3"/>
<text class="ts" x="438" y="930" text-anchor="middle" opacity="0.3">Vin+</text>

<circle cx="490" cy="888" r="3" fill="#e0ddd4" opacity="0.2"/>
<line x1="490" y1="891" x2="490" y2="914" stroke="#e0ddd4" stroke-width="1" opacity="0.3"/>
<text class="ts" x="490" y="930" text-anchor="middle" opacity="0.3">Vin-</text>

<!-- WIRING -->
<path d="M190 231 L30 231 L30 968 L92 968 L92 914" fill="none" stroke="#e0ddd4" stroke-width="1.5"/>
<line x1="20" y1="968" x2="40" y2="968" stroke="#e0ddd4" stroke-width="2"/>
<line x1="23" y1="974" x2="37" y2="974" stroke="#e0ddd4" stroke-width="1.5"/>
<line x1="26" y1="980" x2="34" y2="980" stroke="#e0ddd4" stroke-width="1"/>
<text class="ts" x="30" y="998" text-anchor="middle">GND</text>

<path d="M500 392 L560 392 L560 968 L150 968 L150 914" fill="none" stroke="#534AB7" stroke-width="1.5"/>
<text class="ts" x="566" y="680" fill="#AFA9EC">3V3</text>

<path d="M180 426 L140 426 L140 998 L266 998 L266 930" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text class="ts" x="210" y="1006" text-anchor="middle" fill="#5DCAA5">SDA (D4 / GPIO22)</text>

<path d="M180 448 L130 448 L130 1028 L208 1028 L208 930" fill="none" stroke="#378ADD" stroke-width="1.5"/>
<text class="ts" x="210" y="1040" text-anchor="middle" fill="#85B7EB">SCL (D5 / GPIO23)</text>

<!-- Connection table -->
<text class="ts" x="420" y="998" opacity="0.4">Board silk   GPIO    INA260</text>
<text class="ts" x="420" y="1014" opacity="0.4">3V3          —       Vcc</text>
<text class="ts" x="420" y="1030" opacity="0.4">GND (BFF-)   —       GND</text>
<text class="ts" x="420" y="1046" opacity="0.4">D4           GPIO22  SDA</text>
<text class="ts" x="420" y="1062" opacity="0.4">D5           GPIO23  SCL</text>

<text class="ts" x="40" y="1084" opacity="0.4">Dashed = on-board PCB traces</text>
</svg>
